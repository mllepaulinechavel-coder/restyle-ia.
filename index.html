<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restyle IA</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f3f1ee;color:#1d1b2e}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font:700 30px Georgia,serif;margin:0 0 6px}
p.lead{color:#6b6880;margin-top:0}
.row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;padding:12px;font:inherit;border:1px solid #d9d5e0;border-radius:10px}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:0;background:#3d2bd6;color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
video{width:100%;border-radius:12px;background:#14121f;margin-top:8px}
#msg{color:#6b6880;min-height:24px}
h2{font-size:16px;margin:20px 0 0}
</style>
</head>
<body>
<main>
<h1>Restyle IA</h1>
<p class="lead">Choisissez une courte vidéo (max 10 Mo environ), décrivez le style voulu, et l’IA la transforme.</p>
<div class="row"><input type="file" id="file" accept="video/*"></div>
<div class="row">
  <input type="text" id="prompt" placeholder="Ex. : style dessin animé japonais, couleurs pastel">
  <button id="go">Restyliser</button>
</div>
<p id="msg" role="status">Vérification du serveur…</p>
<h2>Original</h2><video id="orig" controls playsinline></video>
<h2>Résultat</h2><video id="out" controls playsinline></video>
<p><a id="dl" hidden download="restyle.mp4">Télécharger le résultat</a></p>
</main>
<script>
const $=id=>document.getElementById(id);
async function J(r){
  const t=await r.text();
  try{return JSON.parse(t)}
  catch{throw new Error("Le serveur de l’application est introuvable ("+r.status+"). Cette page n’est pas servie par « npm start » ou par votre hébergement Node.")}
}
const msg=t=>{$("msg").textContent=t};
window.onerror=(m)=>msg("Erreur de la page : "+m);
if(location.protocol==="file:") msg("Ne pas ouvrir ce fichier directement. Lancez « npm start » puis ouvrez http://localhost:3000");
else fetch("/api/health").then(r=>r.json()).then(()=>msg("Serveur connecté. Choisissez une vidéo.")).catch(()=>msg("Serveur introuvable. Lancez « npm start » dans le dossier."));

$("file").onchange=e=>{const f=e.target.files[0];if(f)$("orig").src=URL.createObjectURL(f)};

$("go").onclick=async()=>{
  const f=$("file").files[0], p=$("prompt").value.trim();
  if(!f) return msg("Choisissez d’abord une vidéo.");
  if(!p) return msg("Décrivez le style voulu.");
  if(f.size>10*1024*1024) return msg("Vidéo trop lourde : 10 Mo maximum.");
  $("go").disabled=true; $("dl").hidden=true; msg("Envoi de la vidéo à Runway…");
  try{
    const r=await fetch("/api/restyle?prompt="+encodeURIComponent(p),
      {method:"POST",headers:{"Content-Type":f.type||"video/mp4"},body:f});
    const d=await J(r);
    if(!r.ok) throw new Error(typeof d.error==="string"?d.error:JSON.stringify(d.error));
    msg("Tâche créée, attente du résultat…");
    await poll(d.id);
  }catch(e){msg("Erreur : "+e.message)}
  $("go").disabled=false;
};

async function poll(id){
  for(;;){
    await new Promise(r=>setTimeout(r,5000));
    const r=await fetch("/api/status/"+id), d=await J(r);
    if(!r.ok) throw new Error(typeof d.error==="string"?d.error:JSON.stringify(d.error));
    if(d.status==="SUCCEEDED"){
      $("out").src=d.url; $("dl").href=d.url; $("dl").hidden=false;
      return msg("Terminé.");
    }
    if(d.status==="FAILED"||d.status==="CANCELLED") throw new Error(d.error||"La génération a échoué.");
    msg("Traitement en cours… "+(d.progress!=null?Math.round(d.progress*100)+" %":d.status));
  }
}
</script>
</body>
</html>
